N_barcode_positions: 24
N_individuals: 10000
N_initial_infections: 4000
human_age_distribution: true
age_modifies_biting: true
age_modifies_infectiousness: false
bites_from_infected_mosquito_distribution: "constant"
burnin_duration: 1000
daily_bite_rate: 0.1
daily_bite_rate_distribution: "exponential" # constant, gamma are other options
immunity_on: true
include_importations: true
importations_per_day: 0.02739726027 # 1 per thousand individuals per year
importation_allele_freq: 0.5
mean_bites_from_infected_mosquito: 1
prob_survive_to_infectiousness: 1
run_environment: "comps"
save_all_data: true
sim_duration: 6000
timesteps_between_outputs: 50
track_roots: true
# weibull_infection_duration_shape: 2.2
gametocyte_timeseries_shape: "peaked_and_precomputed"  # flat, peaked, or peaked_and_precomputed
oocyst_distribution: "fpg" # fixed or fpg
sporozoite_distribution: "fpg" # fixed or fpg
suppress_gametocytes_in_superinfections: true # if False, all infections identical. If True, superinfections have lower gametocyte densities.
superinfection_gametocyte_suppression_factor: 0.4 # geometric suppression factor of multiply superinfected individuals. Only used if suppress_gametocytes_in_superinfections is True
